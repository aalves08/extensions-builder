    skipped: Skipped

  list:
    title: Builds
    newBuild: New build
    intro: Build the shell packages from a rancher/dashboard pull request, build extensions against them, and serve the result as a Helm repository in this cluster so you can install and test them.
    empty: No builds yet. Create one to get started.
    newBuildCta: New build
    rerun: Re-run
    publishedYes: Published as a repository
    deleteTitle: 'Delete build {id}?'
    deleteBody: This removes the build job, its output volume and the repository it is served from. Any extension already installed from it will stop being able to load.
    deleteFailed: Could not delete the build
    headers:
      state: State
      id: Build
      shell: Shell
      extensions: Extensions
      published: Published
      created: Created

  detail:
    back: Builds
    viewLog: View log
    notFound: This build no longer exists. It may have been deleted.
    failed: The build job failed. Open the log to see why.
    noPod: Waiting for Kubernetes to schedule the build pod. If this does not change, check that the cluster has a default StorageClass and enough free capacity.
    podBlocked: 'The build pod cannot start: {reason}. It will make no progress and produce no log until this is dealt with. The most common cause is a builder image the cluster cannot pull.'
    progress: Progress
    summary: Summary
    shell: Shell source
    shellSha: Resolved commit
    shellRef: Resolved ref
    elapsed: Duration
    packages: Built packages
    publish:
      title: Catalog
      description: Serve the output of this build as a cluster repository so the extensions can be installed from Apps.
      waiting: Available once the build finishes.
      buildFailed: The build failed, so there is nothing to publish.
      action: Publish catalog
      resync: Re-sync repository
      goToExtensions: Go to Extensions
      verified: 'Repository synced and serving {count} chart(s).'
      emptyIndex: The repository synced, but its index is empty. Nothing will show up under Extensions. Check the packaging phase in the build log.
      missingCharts: 'The repository synced, but these charts are missing from its index: {charts}.'

  hostUi:
    title: Host UI
    description: Point the UI of this Rancher install at the dashboard built from the same source, so extensions are tested against the shell they were compiled against.
    warning: This changes global settings and affects every user of this Rancher install on their next page load. Revert when you are done.
    noIndex: This build did not produce a dashboard bundle, or has not reported one yet.
    buildIndex: This build
    currentIndex: ui-dashboard-index
    offlinePreferred: ui-offline-preferred
    unset: not set
    active: Rancher is currently serving the dashboard from this build.
    apply: Use the UI from this build
    revert: Revert
    reloadHint: Hard-refresh the browser after applying or reverting.

  new:
    title: New build
    intro: A build clones the shell source, publishes it to a throwaway npm registry, builds each extension against it, and packages the results as a Helm repository. Expect 20 to 40 minutes.
    submit: Start build
    shell:
      title: Shell source
      description: The rancher/dashboard code the shell packages are built from. This is the change under test.
      mode: Source
      modePr: Pull request
      modeRef: Branch or tag
      repo: Repository
      repoTooltip: Normally rancher/dashboard. Point at a fork if the change lives there.
      pr: Pull request
      prTooltip: The PR number, or paste the full pull request URL. Fetched as refs/pull/<n>/head, so pull requests from forks work too.
      ref: Branch or tag
      refTooltip: Any branch or tag that exists on the repository above.
      refPlaceholder: master
      checking: Checking with GitHub...
      badRepo: That does not look like a GitHub repository.
      badPr: Enter a pull request number or URL.
      noSuchPr: No such pull request on that repository.
      noSuchRef: No such branch or tag on that repository.
      rateLimited: GitHub rate-limited this browser. Wait a few minutes, or carry on - the build itself does not use the API.
      prMeta: 'by {author} · {branch} · {sha}'
      draft: draft
      refOk: '{ref} resolved.'
    extensions:
      title: Extensions
      description: The official list comes from rancher/ui-plugin-charts. Branch and package name are editable per row, and you can add any git repository of your own.
      manifestFailed: 'Could not load the official extension list: {error}. You can still add repositories by hand.'
      selectAtLeastOne: Select at least one extension to build.
      unnamed: Unnamed extension
      latest: 'latest published: {version}'
      edit: Edit
      hide: Hide
      addCustom: Add a repository
      name: Name
      nameTooltip: Used for the clone directory and to identify the row. Must be unique within a build.
      pkg: Package
      pkgTooltip: The folder under pkg/ in that repository. Usually the same as the name.
      ref: Branch or tag
      refTooltip: Leave empty to build the default branch of the repository. The gh-pages branch listed in the manifest holds published charts, not source, so it is never used here.
      repo: Repository
      repoLockedTooltip: Comes from the official extension list and identifies this extension. To build from somewhere else, add a repository instead.
      errors:
        noRepo: A repository URL is required.
        badRepo: Must be an http(s) or git@ URL.
        noPkg: A package name is required.
        noName: A name is required.
        duplicateName: Another selected extension already uses this name.
    options:
      title: Options
      buildDashboard: Also build the Rancher dashboard from the same source
      buildDashboardTooltip: Adds roughly ten minutes to the build and produces a dashboard bundle you can point this Rancher at afterwards.
      buildDashboardHint: An extension can compile against a new shell and still break at runtime inside a stock host, because the host ships the other half of the API. Build the dashboard too to test both halves together.
      dashboardHost: Ingress host
      dashboardHostTooltip: The browser loads the dashboard bundle directly, so it needs a hostname that resolves to the ingress controller for this cluster. This is baked into the bundle at build time and cannot be changed afterwards.
      dashboardTls: Serve over HTTPS
      resolvedUrl: 'The bundle will be served from {url}'
      dashboardWarning: Make sure this hostname already routes to the ingress controller for this cluster, and that a TLS secret exists if you selected HTTPS. The URL is compiled into the bundle, so getting it wrong means building again.

  preflight:
    admin: This feature creates cluster-scoped resources and changes global settings, so it needs an administrator account.
    namespace: 'The namespace {namespace} does not exist. Builds and the repositories they are served from all live in it.'
    nginxConfig: 'The nginx configuration is missing from {namespace}. Without it a finished build has nothing to serve its repository, so publishing would fail.'
    jobSchema: Jobs are not visible in this cluster, so a build cannot be created.
    clusterRepoSchema: Cluster repositories are not visible, so a finished build could not be published.
    noStorageClass: This cluster has more than one StorageClass and none of them is the default, so the build pod would stay Pending forever waiting for its volume. Pick one and mark it as the default.
    storageClassNotDefault: 'This cluster has no default StorageClass, so the build pod would stay Pending forever waiting for its volume. The StorageClass {name} can be made the default.'
    storageClassCreatable: This cluster has no StorageClass at all, so the build pod would stay Pending forever waiting for its volume. The local-path provisioner is already running, so a default StorageClass can be created for it.
    storageClassInstallable: This cluster has no StorageClass and no storage provisioner, so the build pod would stay Pending forever waiting for its volume. The local-path provisioner can be installed for you, into the local-path-storage namespace, and its StorageClass made the default. It keeps volumes on local node disk, which suits throwaway builds.
    multipleStorageClasses: This cluster has more than one default StorageClass. Kubernetes will pick one, which may not be the one you expect.
    fix:
      namespace: Create namespace
      nginxConfig: Create config
      storageClass: Fix storage
      storageProvisioner: Install provisioner
      targetCluster: Cluster to apply this to
      otherCluster: 'Storage was set up in the {cluster} cluster. Builds run in the local cluster, so this check still has to pass there before you can start one.'
      failed: 'Could not fix this: {error}'
